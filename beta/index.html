<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>차차루틴</title>
<link rel="icon" href="icon.png">
<link rel="alternate" hreflang="en" href="en/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--bg:#F5F3EE;--card:#FFFFFF;--text:#1F1D1A;--sub:#6B665E;--line:#E6E2D9;--tint:#2F6B4F;--tint-soft:#E3EEE7;--note:#FFF4D6;--note-text:#6B4E00}
@media (prefers-color-scheme: dark){:root{--bg:#18191A;--card:#28292B;--text:#EEEEEF;--sub:#A9ABAE;--line:#38393C;--tint:#4ED49A;--tint-soft:#173A2B;--note:#3A3018;--note-text:#F2D58A}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 64px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:24px}
header.top a{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:600}
header.top img{width:32px;height:32px;border-radius:8px}
.beta{background:var(--note);color:var(--note-text);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.beta a{color:inherit;font-weight:600}
article{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:600}
h1{font-size:26px;line-height:1.35;margin:0 0 16px}
h2{font-size:18px;margin:32px 0 8px}
h3{font-size:16px;margin:24px 0 6px}
p,li{font-size:15px}
ul{padding-left:20px}
a{color:var(--tint)}
footer{margin-top:24px;color:var(--sub);font-size:13px;text-align:center}
footer a{color:var(--sub);margin:0 8px}
.hero{text-align:center;padding:40px 8px}
.hero img{width:96px;height:96px;border-radius:22px}
.hero h1{margin:20px 0 8px}
.hero p{color:var(--sub);margin:0 0 28px}
.links{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.links a{display:block;padding:14px 16px;border-radius:14px;background:var(--tint-soft);color:var(--tint);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a href="./"><img src="icon.png" alt="">차차루틴</a></header>
<div class="beta" role="note">베타 테스트(TestFlight) 버전 1.1.0의 문서예요. App Store 버전의 문서는 <a href="../">여기</a>에 있어요.</div>
<section class="hero">
<img src="icon.png" alt="차차루틴 앱 아이콘">
<h1>차차루틴</h1>
<p>조금씩 쌓는 하루 루틴</p>
<nav class="links"><a href="support/">고객 지원</a><a href="privacy/">개인정보처리방침</a></nav>
</section>
<footer><a href="support/">고객 지원</a><a href="privacy/">개인정보처리방침</a><a href="en/" hreflang="en" lang="en">English</a></footer>
</div>
</body>
</html>
